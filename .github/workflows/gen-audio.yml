name: Generate audio
on:
  workflow_dispatch:
    inputs:
      voice: { description: "Azure voice", default: "en-US-SaraNeural" }
      limit: { description: "Only first N questions (blank = all)", default: "" }
permissions:
  contents: write
concurrency: gen-audio
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "azure-cognitiveservices-speech>=1.40"
      - run: python tools/gen_audio.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          VOICE: ${{ inputs.voice }}
          LIMIT: ${{ inputs.limit }}
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add audio && git commit -qm "Generate audio (${{ inputs.voice }})" && git push || echo "nothing to commit"
