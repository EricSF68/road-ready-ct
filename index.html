<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Road Ready">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Road Ready CT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ok:#1a7f37;--bad:#c62828;--line:#d0d0d0;--soft:#f4f4f4;--muted:#666;--hl:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#000;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#app{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
.menu{background:none;border:0;font-size:15px;color:var(--muted);padding:6px 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:#000;width:0;transition:width .3s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.tag{font-size:13px;color:var(--muted)}
.say{flex:0 0 auto;width:138px;justify-content:center;white-space:nowrap;display:flex;align-items:center;gap:6px;background:#fff;color:#000;border:1.5px solid #000;border-radius:20px;padding:6px 12px;font:inherit;font-size:15px;font-weight:600}
.say svg{width:18px;height:18px}
.say.on{background:#000;color:#fff}
.q{font-size:19px;font-weight:600;margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:#000;
  border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;font:inherit;font-size:16px}
.opt .l{flex:0 0 26px;height:26px;border-radius:13px;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt:active{background:var(--soft)}
.opt.right{border-color:var(--ok);background:#e9f6ec}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.opt.locked{opacity:.4}
.wait{margin:2px 0 10px}.wait .bar{margin:6px 0 0}
.w{border-radius:3px}
.w.hl{background:var(--hl)}
.l.hl{box-shadow:0 0 0 4px var(--hl)}
.vlist{max-height:55vh;overflow:auto;margin:8px 0}
.vopt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;font:inherit;font-size:15px;color:#000}
.vopt.sel{border-color:#000;border-width:2px;font-weight:600}
.vopt i{font-style:normal;color:var(--muted);font-size:13px}
.fb{border-radius:12px;padding:12px;margin:4px 0 12px;font-size:15px;background:var(--soft)}
.fb.ok{background:#e9f6ec}.fb.no{background:#fdecec}
.fb .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.fb strong{font-size:17px}
.fb p{margin:6px 0}
.fb .wr{display:flex;gap:8px;margin:6px 0}
.fb .wr .l{flex:0 0 22px;height:22px;border-radius:11px;border:1.5px solid #999;color:#555;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.btn{display:block;width:100%;background:#000;color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:17px;margin-top:6px}
.btn.alt{background:#fff;color:#000;border:1.5px solid #000}
.center{text-align:center;padding-top:30px}
.big{font-size:56px;margin:10px 0}
.small{font-size:14px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
</style>
</head>
<body>
<div id="app"><p class="center">Loading…</p></div>
<script>
(function(){
"use strict";
var KEY = "roadready.v1";
var app = document.getElementById("app");
var Q = [];          // questions [{id,q,options,answer,ref,why,wrong}]
var S = null;        // state: {p:{id:{s,a,w}}, cur:{id,order,chosen}, round, last}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function fresh(){ return { p:{}, cur:null, round:1, last:null }; }
function prog(id){ return S.p[id] || {s:0,a:0,w:0}; }
function counts(){
  var c={known:0,once:0,missed:0,unasked:0,total:Q.length};
  Q.forEach(function(q){ var p=prog(q.id);
    if(p.s>=2) c.known++; else if(p.s===1) c.once++; else if(p.a>0) c.missed++; else c.unasked++; });
  return c;
}
function pool(){ return Q.filter(function(q){ return prog(q.id).s<2; }); }
function pick(){
  var av = pool();
  if(!av.length){ S.cur=null; save(); return; }
  if(av.length>1 && S.last) av = av.filter(function(q){ return q.id!==S.last; });
  var q = av[Math.floor(Math.random()*av.length)];
  S.cur = { id:q.id, order:shuffle([0,1,2,3]), chosen:null };
  save();
}

/* ---------- Read-aloud with word highlighting (iOS built-in voices via Web Speech API) ---------- */
var TTS = { on:false, timer:null, gotBoundary:false, words:[], btn:null };
var synth = window.speechSynthesis || null;
var voice = null;
var VKEY = KEY + ".voice";
function enVoices(){
  if(!synth) return [];
  // Hide Apple's novelty "Effects" and robotic "Eloquence" voices, and duplicates.
  var junk = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
  var seen = {};
  var vs = synth.getVoices().filter(function(v){
    if(!/^en/i.test(v.lang) || junk.test(v.name) || /eloquence|novelty|speech\.synthesis\.voice/i.test(v.voiceURI||"")) return false;
    var k=v.name+"|"+v.lang; if(seen[k]) return false; seen[k]=1; return true;
  });
  function rank(v){ return (/premium/i.test(v.name+v.voiceURI)?0:/enhanced/i.test(v.name+v.voiceURI)?1:2)*10 + (/^en[-_]US/i.test(v.lang)?0:1); }
  return vs.sort(function(a,b){ return rank(a)-rank(b) || a.name.localeCompare(b.name); });
}
function voiceTier(v){ var s=v.name+" "+(v.voiceURI||""); return /premium/i.test(s)?"Premium":/enhanced/i.test(s)?"Enhanced":""; }
function pickVoice(){
  if(!synth) return;
  var vs = enVoices(), saved=null; try{ saved=localStorage.getItem(VKEY); }catch(e){}
  voice = (saved && vs.find(function(v){ return v.voiceURI===saved; })) || null;
  if(!voice){
    var pref = [/premium/i,/enhanced/i,/samantha/i,/ava/i,/allison/i];
    for(var i=0;i<pref.length && !voice;i++){ voice = vs.find(function(v){ return pref[i].test(v.name+" "+v.voiceURI) && /^en[-_]US/i.test(v.lang); }) || null; }
  }
  if(!voice) voice = vs.find(function(v){ return v.default; }) || vs[0] || null;
}
if(synth){ pickVoice(); if(synth.addEventListener) synth.addEventListener("voiceschanged", function(){ voice=null; pickVoice(); }); }

// Turn a displayed word into what the voice should say (display text stays unchanged).
function spoken(w){
  var core = w.replace(/^[("'“]+|[)"'”,.;:!?]+$/g,"");
  var map = {"mph":"miles per hour","ft":"feet","p.":"page","pp.":"pages","vs":"versus","vs.":"versus","&":"and","DMV":"D M V","GDL":"G D L","HOV":"H O V","IID":"I I D","RR":"R R","EMS":"E M S","U-turn":"U turn","U-turns":"U turns"};
  if(map[core]) return w.replace(core, map[core]);
  if(/^p\.\d/.test(core)) return w.replace(/^p\./,"page ");
  return w.replace(/(\d+)%/g,"$1 percent").replace(/^\.(\d)/,"point $1").replace(/(\d)\/(\d)/g,"$1 $2").replace(/\//g," ").replace(/–|—/g," to ");
}
// Wrap text into word spans; returns html and registers words for one utterance segment.
function wordsHTML(text, seg){
  return String(text).split(/(\s+)/).map(function(t){
    if(!t.trim()) return t;
    return '<span class="w" data-seg="'+seg+'">'+esc(t)+'</span>';
  }).join("");
}
function clearHL(){ var o=app.querySelectorAll(".hl"); for(var i=0;i<o.length;i++) o[i].classList.remove("hl"); }
function stopTTS(){
  TTS.on=false; clearTimeout(TTS.timer);
  if(synth){ try{ synth.cancel(); }catch(e){} }
  clearHL(); if(TTS.btn){ TTS.btn.classList.remove("on"); TTS.btn.querySelector("b").textContent="Read aloud"; }
}
// segs: [{prefix:"spoken intro", seg:id}] ; words come from DOM spans with data-seg
function speakSegs(segs, btn){
  if(!synth){ btn.querySelector("b").textContent="Speech not available"; return; }
  stopTTS(); TTS.on=true; TTS.btn=btn; btn.classList.add("on"); btn.querySelector("b").textContent="Stop";
  // Expand each segment into an optional short intro ("Answer B"), a pause, then the highlighted text.
  var steps=[];
  segs.forEach(function(sg){
    if(sg.prefix) steps.push({intro:sg.prefix, badge:sg.badge, pause:450});
    steps.push({seg:sg.seg});
  });
  var i=0;
  function utter(text){
    var u=new SpeechSynthesisUtterance(text);
    if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang="en-US";
    u.rate=0.95; return u;
  }
  function next(){
    if(!TTS.on) return;
    if(i>=steps.length){ stopTTS(); return; }
    var st=steps[i++];
    if(st.intro){
      var b=st.badge?app.querySelector(st.badge):null;
      var ui=utter(st.intro);
      ui.onstart=function(){ clearHL(); if(b&&TTS.on) b.classList.add("hl"); };
      ui.onend=function(){ setTimeout(function(){ if(b) b.classList.remove("hl"); next(); }, st.pause); };
      ui.onerror=function(){ if(TTS.on) setTimeout(next, st.pause); };
      synth.speak(ui); return;
    }
    var spans=[].slice.call(app.querySelectorAll('.w[data-seg="'+st.seg+'"]'));
    var text="", starts=[];
    spans.forEach(function(s){ if(text) text+=" "; starts.push(text.length); text+=spoken(s.textContent); });
    var u=utter(text);
    var hlAt=function(ci){
      var k=-1; for(var j=0;j<starts.length;j++){ if(starts[j]<=ci) k=j; else break; }
      clearHL(); if(k>=0 && spans[k]) spans[k].classList.add("hl");
    };
    TTS.gotBoundary=false;
    u.onboundary=function(e){ if(!TTS.on) return; if(e.name && e.name!=="word") return; TTS.gotBoundary=true; clearTimeout(TTS.timer); hlAt(e.charIndex); };
    u.onstart=function(){
      if(!TTS.on) return;
      // Fallback if this device sends no word events: estimate timing from word lengths.
      var t0=Date.now(), cps=13.5*u.rate;
      (function tick(){
        if(!TTS.on || TTS.gotBoundary) return;
        hlAt(Math.floor((Date.now()-t0)/1000*cps));
        TTS.timer=setTimeout(tick,90);
      })();
    };
    u.onend=function(){ clearTimeout(TTS.timer); clearHL(); setTimeout(next,120); };
    u.onerror=function(){ clearTimeout(TTS.timer); clearHL(); if(TTS.on) setTimeout(next,120); };
    synth.speak(u);
  }
  // iOS sometimes drops a speak() issued right after cancel(); give it a moment.
  setTimeout(next, 60);
}
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function sayBtn(act){ return '<button class="say" data-act="'+act+'">'+SPK+'<b>Read aloud</b></button>'; }

/* ---------- Screens ---------- */
function statsHTML(){
  var c=counts();
  return '<div class="stats">'+
    '<div class="stat"><b>'+c.known+'</b><span>Known</span></div>'+
    '<div class="stat"><b>'+c.once+'</b><span>Right 1×</span></div>'+
    '<div class="stat"><b>'+c.missed+'</b><span>Missed</span></div>'+
    '<div class="stat"><b>'+c.unasked+'</b><span>Not asked</span></div></div>'+
    '<div class="bar"><i style="width:'+(c.total?100*c.known/c.total:0)+'%"></i></div>';
}
function head(){ return '<header><h1>Road Ready CT</h1><button class="menu" data-act="menu">Menu</button></header>'; }
function curQ(){ return Q.find(function(x){return x.id===S.cur.id;}); }

function render(){
  stopTTS();
  if(!S.cur && pool().length) pick();
  if(!S.cur){ return renderDone(); }
  var q = curQ();
  if(!q){ S.cur=null; pick(); return render(); }
  var ansIdx = "ABCD".indexOf(q.answer), chosen = S.cur.chosen, p = prog(q.id);
  var html = head()+statsHTML();
  var tag = chosen!==null ? '' : (p.s===1?'Get this right once more to know it':(p.a>0?'You missed this one before':'New question'));
  html += '<div class="row"><div class="tag">'+tag+'</div>'+(chosen===null?sayBtn("readq"):'')+'</div>';
  html += '<p class="q">'+wordsHTML(q.q,"q")+'</p>';
  var need=0, left=0;
  if(chosen===null && delayOn()){
    if(!S.cur.shownAt){ S.cur.shownAt=Date.now(); save(); }
    need=readMs(q.q); left=S.cur.shownAt+need-Date.now();
    if(left>0) html += '<div class="wait"><div class="small">Read the question first. The answers unlock in a moment.</div><div class="bar"><i style="width:'+Math.round(100*(need-left)/need)+'%"></i></div></div>';
  }
  S.cur.order.forEach(function(oi,pos){
    var cls="opt";
    if(chosen!==null){ if(oi===ansIdx) cls+=" right"; else if(oi===chosen) cls+=" wrong"; else cls+=" dim"; }
    html += '<button class="'+cls+'" data-opt="'+oi+'"><span class="l" data-b="o'+pos+'">'+"ABCD"[pos]+'</span><span>'+wordsHTML(q.options[oi],"o"+pos)+'</span></button>';
  });
  if(chosen!==null){
    var ok = chosen===ansIdx, np = prog(q.id);
    var msg = ok ? (np.s>=2?"Correct! You know this one now.":"Correct! Get it right once more to know it.") : "Not quite. The right answer is in green.";
    var correctPos = S.cur.order.indexOf(ansIdx);
    html += '<div class="fb '+(ok?'ok':'no')+'"><div class="head"><strong>'+msg+'</strong>'+sayBtn("reade")+'</div>';
    html += '<p><b>Why '+"ABCD"[correctPos]+' is right:</b> '+wordsHTML(q.why||q.ref,"why")+'</p>';
    if(q.wrong){
      S.cur.order.forEach(function(oi,pos){
        if(oi===ansIdx || !q.wrong[oi]) return;
        html += '<div class="wr"><span class="l" data-b="x'+pos+'">'+"ABCD"[pos]+'</span><span>'+wordsHTML(q.wrong[oi],"x"+pos)+'</span></div>';
      });
    }
    html += '</div><button class="btn" data-act="next">Next question</button>';
  }
  app.innerHTML = html;
  if(chosen!==null){ var f=app.querySelector('.fb'); if(f) f.scrollIntoView({block:"start",behavior:"instant"}); }
  else window.scrollTo(0,0);
  if(chosen===null && delayOn() && left>0) lockAnswers(left, need);
}

/* ---------- Delay answering: answers stay locked until a normal-to-fast reader (~250 words/min) could read the question ---------- */
var DKEY = KEY + ".delay", lockTimer=null;
function delayOn(){ try{ return localStorage.getItem(DKEY)==="1"; }catch(e){ return false; } }
function readMs(text){ var words=String(text).trim().split(/\s+/).length; return Math.max(2000, Math.round(words/250*60000)); }
function lockAnswers(left, need){
  clearInterval(lockTimer);
  var opts=app.querySelectorAll(".opt"); for(var i=0;i<opts.length;i++){ opts[i].classList.add("locked"); opts[i].disabled=true; }
  var end=Date.now()+left, bar=app.querySelector(".wait .bar i");
  lockTimer=setInterval(function(){
    var rem=end-Date.now();
    if(bar) bar.style.width=Math.min(100,Math.round(100*(need-Math.max(0,rem))/need))+"%";
    if(rem<=0){
      clearInterval(lockTimer);
      var o=app.querySelectorAll(".opt.locked"); for(var j=0;j<o.length;j++){ o[j].classList.remove("locked"); o[j].disabled=false; }
      var w=app.querySelector(".wait"); if(w) w.style.visibility="hidden"; // keep its space so answers don't jump
    }
  },100);
}

function readQuestion(btn){
  var segs=[{seg:"q"}];
  for(var pos=0;pos<4;pos++) segs.push({seg:"o"+pos, prefix:"Answer "+"ABCD"[pos], badge:'[data-b="o'+pos+'"]'});
  speakSegs(segs, btn);
}
function readExplanation(btn){
  var q=curQ(), ansIdx="ABCD".indexOf(q.answer), cp=S.cur.order.indexOf(ansIdx);
  var segs=[{seg:"why", prefix:"The right answer is "+"ABCD"[cp], badge:'[data-b="o'+cp+'"]'}];
  S.cur.order.forEach(function(oi,pos){ if(oi!==ansIdx && q.wrong && q.wrong[oi]) segs.push({seg:"x"+pos, prefix:"Answer "+"ABCD"[pos]+" is wrong", badge:'[data-b="x'+pos+'"]'}); });
  speakSegs(segs, btn);
}

function renderDone(){
  var c=counts();
  app.innerHTML = head()+statsHTML()+
    '<div class="center"><div class="big">🎉</div><h2>Congratulations!</h2>'+
    '<p>You know all '+c.total+' questions'+(S.round>1?' (round '+S.round+')':'')+'.<br>You are ready for the Connecticut knowledge test.</p>'+
    '<p>Want to learn them all again?</p>'+
    '<button class="btn" data-act="again">Yes, start over</button>'+
    '<p class="small">Progress is saved on this phone.</p></div>';
}

function answer(oi){
  if(!S.cur || S.cur.chosen!==null) return;
  if(app.querySelector(".opt.locked")) return;
  clearInterval(lockTimer);
  var q = curQ(), ok = oi === "ABCD".indexOf(q.answer), p = prog(q.id);
  p.a++; if(ok){ p.s=Math.min(2,p.s+1); } else { p.s=0; p.w++; }
  S.p[q.id]=p; S.cur.chosen=oi; save(); render();
}

function menu(){
  stopTTS();
  var d=document.createElement("div"); d.className="sheet";
  var c=counts();
  d.innerHTML='<div><p><b>'+c.known+' of '+c.total+'</b> questions known.</p>'+
    '<button class="btn alt" data-act="close">Keep studying</button>'+
    '<button class="btn alt" data-act="voices" style="margin-top:10px">Reading voice: '+esc(voice?voice.name:"default")+'</button>'+
    '<button class="btn alt" data-act="delay" style="margin-top:10px">Delay answering: '+(delayOn()?'ON':'OFF')+'</button>'+
    '<button class="btn alt" data-act="reload" style="margin-top:10px">Reload app (keeps progress)</button>'+
    '<button class="btn alt" data-act="reset1" style="margin-top:10px">Start over from zero</button></div>';
  document.body.appendChild(d);
  d.addEventListener("click",function(e){
    var t=e.target.closest("[data-act]");
    if(e.target===d || (t&&t.dataset.act==="close")){ if(synth) synth.cancel(); d.remove(); render(); return; }
    if(t&&t.dataset.act==="voices"){ voiceSheet(d.firstChild); return; }
    if(t&&t.dataset.act==="voice"){
      var v=enVoices().find(function(x){ return x.voiceURI===t.dataset.uri; });
      if(v){ voice=v; try{ localStorage.setItem(VKEY,v.voiceURI); }catch(err){}
        synth.cancel(); var u=new SpeechSynthesisUtterance("Hi Ruby. This is how I will read your questions."); u.voice=v; u.lang=v.lang; u.rate=0.95; synth.speak(u);
        voiceSheet(d.firstChild); }
      return;
    }
    if(t&&t.dataset.act==="reset1"){ t.textContent="Tap again to erase all progress"; t.dataset.act="reset2"; t.style.borderColor="#c62828"; t.style.color="#c62828"; return; }
    if(t&&t.dataset.act==="delay"){ var on=!delayOn(); try{ localStorage.setItem(DKEY,on?"1":"0"); }catch(err){}
      t.textContent="Delay answering: "+(on?"ON":"OFF"); if(S.cur && S.cur.chosen===null) S.cur.shownAt=Date.now(); save(); return; }
    if(t&&t.dataset.act==="reload"){ location.reload(); return; }
    if(t&&t.dataset.act==="reset2"){ var r=S.round; S=fresh(); S.round=r; save(); location.reload(); }
  });
}

function voiceSheet(box){
  var vs=enVoices();
  var hasGood=vs.some(function(v){ return voiceTier(v); });
  box.innerHTML='<p><b>Choose a reading voice</b><br><span class="small">Tap a voice to hear it.</span></p><div class="vlist">'+
    (vs.length? vs.map(function(v){
      var t=voiceTier(v);
      return '<button class="vopt'+(voice&&v.voiceURI===voice.voiceURI?' sel':'')+'" data-act="voice" data-uri="'+esc(v.voiceURI)+'">'+esc(v.name)+(t?' · '+t:'')+' <i>'+esc(v.lang)+'</i></button>';
    }).join("") : '<p class="small">No voices found on this device.</p>')+'</div>'+
    (hasGood?'':'<p class="small">Note: Apple does not let web apps use the Enhanced or Premium voices you download in Settings, so they will not appear here. These are the built-in voices web apps can use.</p>')+
    '<button class="btn alt" data-act="close">Done</button>';
}

app.addEventListener("click",function(e){
  var o=e.target.closest("[data-opt]"); if(o){ stopTTS(); answer(+o.dataset.opt); return; }
  var t=e.target.closest("[data-act]"); if(!t) return;
  var a=t.dataset.act;
  if(a==="readq"||a==="reade"){ if(TTS.on){ stopTTS(); return; } if(a==="readq") readQuestion(t); else readExplanation(t); }
  else if(a==="next"){ S.last=S.cur&&S.cur.id; S.cur=null; pick(); render(); }
  else if(a==="again"){ var r=(S.round||1)+1; S=fresh(); S.round=r; save(); render(); }
  else if(a==="menu"){ menu(); }
});
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden") stopTTS(); });

function start(data){
  Q = data.questions;
  try{ localStorage.setItem(KEY+".q", JSON.stringify(data)); }catch(e){}
  S = load() || fresh();
  render();
}
fetch("questions.json",{cache:"no-cache"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(start)
  .catch(function(){
    var c=null; try{ c=JSON.parse(localStorage.getItem(KEY+".q")); }catch(e){}
    if(c) start(c); else app.innerHTML='<p class="center">Could not load questions. Connect to the internet and open the app once.</p>';
  });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
window.__rr={speakSegs:speakSegs};
})();
</script>
